services:
  echolingo-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: echolingo-server:latest
    container_name: echolingo-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      ECHOLINGO_CACHE_DIR: /app/cache
      ECHOLINGO_YTDLP_PATH: yt-dlp
      ECHOLINGO_YTDLP_TIMEOUT_MS: "120000"
      ECHOLINGO_YTDLP_PROXY_LIST: "${ECHOLINGO_YTDLP_PROXY_LIST}"
      ECHOLINGO_DEEPL_KEY: ""
      ECHOLINGO_GROQ_API_KEY: "${GROQ_API_KEY}"
    volumes:
      - echolingo-cache:/app/cache
      - ./cookies.txt:/app/cookies.txt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  echolingo-cache:
