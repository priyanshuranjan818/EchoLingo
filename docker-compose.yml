services:
  echolingo-server:
    build:
      context: .                      # repo root (Dockerfile uses COPY server/...)
      dockerfile: server/Dockerfile
    image: echolingo-server:latest
    container_name: echolingo-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      ECHOLINGO_CACHE_DIR: /app/cache
      ECHOLINGO_YTDLP_PATH: /usr/local/bin/yt-dlp
      ECHOLINGO_YTDLP_TIMEOUT_MS: "60000"
      ECHOLINGO_YTDLP_PROXY_LIST: ""          # comma-separated proxies, or leave blank
      ECHOLINGO_DEEPL_KEY: ""                 # optional DeepL key
      ECHOLINGO_GROQ_API_KEY: "${GROQ_API_KEY}"  # loaded from .env file
    volumes:
      - echolingo-cache:/app/cache            # subtitle cache survives container restarts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  echolingo-cache:
